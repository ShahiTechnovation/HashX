version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hashx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hashx_v1}
      POSTGRES_USER: ${POSTGRES_USER:-hashx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hashx} -d ${POSTGRES_DB:-hashx_v1}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hashx-internal

  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    # Apply versioned migrations, then start (the server refuses to run with pending migrations).
    command: ["sh", "-c", "node dist/server/src/db/migrate.js && node dist/server/src/server.js"]
    container_name: hashx-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgresql://${POSTGRES_USER:-hashx}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hashx_v1}
      HSP_MCP_STREAMABLE_HTTP_ENDPOINT: ${HSP_MCP_STREAMABLE_HTTP_ENDPOINT:-}
      HSP_MERCHANT_NAME: ${HSP_MERCHANT_NAME:-HashX}
      HSP_APP_KEY: ${HSP_APP_KEY}
      HSP_APP_SECRET: ${HSP_APP_SECRET}
      HSP_ALLOWLIST_CONFIRMED: ${HSP_ALLOWLIST_CONFIRMED:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS}
      SIWE_ALLOWED_DOMAINS: ${SIWE_ALLOWED_DOMAINS:?set SIWE_ALLOWED_DOMAINS}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      SEPOLIA_RPC_URL: ${SEPOLIA_RPC_URL:?set SEPOLIA_RPC_URL}
      SEPOLIA_FINALITY_POLICY: ${SEPOLIA_FINALITY_POLICY:-confirmations:12}
      EVIDENCE_REGISTRY_ADDRESS_SEPOLIA: ${EVIDENCE_REGISTRY_ADDRESS_SEPOLIA:-}
      HSK_TESTNET_RPC: ${HSK_TESTNET_RPC:-https://testnet.hsk.xyz}
      HSK_MAINNET_RPC: ${HSK_MAINNET_RPC:-https://mainnet.hsk.xyz}
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - hashx-internal
      - hashx-egress

volumes:
  postgres_data:
    driver: local

networks:
  hashx-internal:
    driver: bridge
  hashx-egress:
    driver: bridge

